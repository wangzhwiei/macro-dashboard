name: Update and deploy macro dashboard

on:
  workflow_dispatch:
  schedule:
    # 08:30 and 09:10 Asia/Shanghai. Scheduled workflows run from default branch gh-pages.
    - cron: "30 0 * * *"
    - cron: "10 1 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: macro-dashboard-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, cjhx-internal, windows]
    timeout-minutes: 45
    env:
      MACRO_DATA_ADAPTER: hybrid
      PYTHONUTF8: "1"
    steps:
      - name: Checkout main source (attempt 1)
        id: checkout_1
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          ref: main
          clean: true

      - name: Wait before checkout retry 2
        if: steps.checkout_1.outcome == 'failure'
        shell: powershell
        run: Start-Sleep -Seconds 60

      - name: Checkout main source (attempt 2)
        id: checkout_2
        if: steps.checkout_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          ref: main
          clean: true

      - name: Wait before checkout retry 3
        if: steps.checkout_1.outcome == 'failure' && steps.checkout_2.outcome == 'failure'
        shell: powershell
        run: Start-Sleep -Seconds 60

      - name: Checkout main source (attempt 3)
        id: checkout_3
        if: steps.checkout_1.outcome == 'failure' && steps.checkout_2.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          ref: main
          clean: true

      - name: Restore main source through GitHub API
        id: checkout_archive
        if: steps.checkout_1.outcome == 'failure' && steps.checkout_2.outcome == 'failure' && steps.checkout_3.outcome == 'failure'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "User-Agent" = "MacroDashboard-DailyUpdate"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $archive = Join-Path $env:RUNNER_TEMP "macro-dashboard-main.zip"
          $extract = Join-Path $env:RUNNER_TEMP "macro-dashboard-main"
          if (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive -Force }
          if (Test-Path -LiteralPath $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }
          Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/zipball/main" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $source = Get-ChildItem -LiteralPath $extract -Directory | Select-Object -First 1
          if (-not $source) { throw "GitHub API source archive is empty." }
          $workspace = (Get-Location).Path
          Get-ChildItem -LiteralPath $workspace -Force |
            Where-Object { $_.Name -ne ".git" } |
            ForEach-Object { Remove-Item -LiteralPath $_.FullName -Recurse -Force }
          Get-ChildItem -LiteralPath $source.FullName -Force |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $workspace -Recurse -Force }
          "SOURCE_FROM_ARCHIVE=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Require a successful source checkout
        if: steps.checkout_1.outcome != 'success' && steps.checkout_2.outcome != 'success' && steps.checkout_3.outcome != 'success' && steps.checkout_archive.outcome != 'success'
        shell: powershell
        run: throw "Unable to obtain main source after Git and API retries."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        shell: cmd
        run: npm ci --no-audit --no-fund

      - name: Verify internal iFinD runtime
        shell: cmd
        run: wsl.exe -d Ubuntu -- bash -lc "test -f /home/wangzhiwei202307/.openclaw/workspace/skills/ifind-finance-data/ifind-finance-data/call.py && test -s /home/wangzhiwei202307/.openclaw/workspace/skills/ifind-finance-data/ifind-finance-data/mcp_config.json"

      - name: Refresh data and validate structural integrity
        shell: cmd
        run: >-
          wsl.exe -d Ubuntu -- bash -lc "export PYTHONUTF8=1; export IFIND_SKILL_DIR='/home/wangzhiwei202307/.openclaw/workspace/skills/ifind-finance-data/ifind-finance-data'; export MACRO_DATA_CACHE_DIR='/mnt/c/Users/wangzhiwei202307/Documents/宏观网页面板/github-runner/ifind-cache'; unset IFIND_CACHE_ONLY; python3 scripts/run_pipeline.py --adapter hybrid --days 1310 --data-only --allow-stale"

      - name: Build GitHub Pages site
        shell: cmd
        run: npm run build:github

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Persist refreshed dashboard data
        if: env.SOURCE_FROM_ARCHIVE != 'true'
        shell: powershell
        run: |
          git config user.name "macro-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/dashboard.json public/data/forecasts.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No generated data changes to commit."
            exit 0
          }
          git commit -m "data: automated daily refresh"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Package GitHub Pages artifact on Windows
        shell: powershell
        run: |
          $artifact = Join-Path $env:RUNNER_TEMP "artifact.tar"
          if (Test-Path -LiteralPath $artifact) {
            Remove-Item -LiteralPath $artifact -Force
          }
          & "$env:SystemRoot\System32\tar.exe" -cf $artifact -C docs .
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $artifact)) {
            throw "Failed to create GitHub Pages artifact."
          }

      - name: Upload GitHub Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Upload data quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-report
          path: |
            outputs/data-quality-report.json
            outputs/frequency-freshness-audit.csv
          if-no-files-found: warn

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
