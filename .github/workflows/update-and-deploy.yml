name: Update and deploy macro dashboard

on:
  workflow_dispatch:
  schedule:
    # 08:30 and 09:10 Asia/Shanghai. Scheduled workflows run from default branch gh-pages.
    - cron: "30 0 * * *"
    - cron: "10 1 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: macro-dashboard-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, cjhx-internal, windows]
    timeout-minutes: 45
    env:
      MACRO_DATA_ADAPTER: hybrid
      PYTHONUTF8: "1"
    steps:
      - name: Checkout main source
        uses: actions/checkout@v6
        with:
          ref: main
          clean: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        shell: cmd
        run: npm ci --no-audit --no-fund

      - name: Verify internal iFinD runtime
        shell: cmd
        run: wsl.exe -d Ubuntu -- bash -lc "test -f /home/wangzhiwei202307/.openclaw/workspace/skills/ifind-finance-data/ifind-finance-data/call.py && test -s /home/wangzhiwei202307/.openclaw/workspace/skills/ifind-finance-data/ifind-finance-data/mcp_config.json"

      - name: Refresh and strictly validate all data
        shell: cmd
        run: >-
          wsl.exe -d Ubuntu -- bash -lc "export PYTHONUTF8=1; export IFIND_SKILL_DIR='/home/wangzhiwei202307/.openclaw/workspace/skills/ifind-finance-data/ifind-finance-data'; export MACRO_DATA_CACHE_DIR='/mnt/c/Users/wangzhiwei202307/Documents/宏观网页面板/github-runner/ifind-cache'; unset IFIND_CACHE_ONLY; python3 scripts/run_pipeline.py --adapter hybrid --days 1310 --data-only"

      - name: Build GitHub Pages site
        shell: cmd
        run: npm run build:github

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Persist refreshed dashboard data
        shell: powershell
        run: |
          git config user.name "macro-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/dashboard.json public/data/forecasts.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No generated data changes to commit."
            exit 0
          }
          git commit -m "data: automated daily refresh"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Upload data quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-report
          path: |
            outputs/data-quality-report.json
            outputs/frequency-freshness-audit.csv
          if-no-files-found: warn

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4