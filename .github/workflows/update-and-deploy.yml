name: Update, validate and deploy macro dashboard

on:
  workflow_dispatch:
  schedule:
    # 08:30 Asia/Shanghai, every day (90 minutes after the 07:00 CJHX update).
    - cron: "30 0 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: macro-dashboard-production
  cancel-in-progress: false

jobs:
  update-and-build:
    # Internal CJHX/iFinD endpoints and credential stores are not reachable
    # from GitHub-hosted runners. Register an internal runner with this label.
    runs-on: [self-hosted, cjhx-internal, windows]
    timeout-minutes: 45
    env:
      MACRO_DATA_ADAPTER: hybrid
      PYTHONUTF8: "1"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Restore incremental iFinD cache
        uses: actions/cache@v4
        with:
          path: data_cache
          key: ifind-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ifind-cache-${{ runner.os }}-

      - name: Install frontend dependencies
        shell: cmd
        run: npm ci --no-audit --no-fund

      - name: Verify WSL iFinD skill
        shell: cmd
        run: wsl.exe -d Ubuntu -- bash -lc "test -f /home/wangzhiwei202307/.openclaw/workspace/skills/ifind-finance-data/ifind-finance-data/call.py && test -s /home/wangzhiwei202307/.openclaw/workspace/skills/ifind-finance-data/ifind-finance-data/mcp_config.json"

      - name: Fetch data with WSL iFinD skill
        shell: cmd
        run: >-
          wsl.exe -d Ubuntu -- bash -lc "export PYTHONUTF8=1; export IFIND_SKILL_DIR='/home/wangzhiwei202307/.openclaw/workspace/skills/ifind-finance-data/ifind-finance-data'; export MACRO_DATA_CACHE_DIR='/mnt/c/Users/wangzhiwei202307/Documents/宏观网页面板/github-runner/ifind-cache'; unset IFIND_CACHE_ONLY; python3 scripts/run_pipeline.py --adapter hybrid --days 1310 --data-only"

      - name: Build static site
        shell: cmd
        run: npm run build:github

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-report
          path: outputs/data-quality-report.json
          if-no-files-found: warn

      - name: Archive Pages artifact
        shell: cmd
        run: wsl.exe -d Ubuntu -- bash -lc "tar --dereference --hard-dereference --directory docs -cvf $PWD/github-pages.tar --exclude=.git --exclude=.github --force-local ."

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: github-pages.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: update-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
