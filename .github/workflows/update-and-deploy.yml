name: Update, validate and deploy macro dashboard

on:
  workflow_dispatch:
  schedule:
    # 08:30 Asia/Shanghai, every day (90 minutes after the 07:00 CJHX update).
    - cron: "30 0 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: macro-dashboard-production
  cancel-in-progress: false

jobs:
  update-and-build:
    # Internal CJHX/iFinD endpoints and credential stores are not reachable
    # from GitHub-hosted runners. Register an internal runner with this label.
    runs-on: [self-hosted, cjhx-internal, windows]
    timeout-minutes: 45
    env:
      MACRO_DATA_ADAPTER: hybrid
      PYTHONUTF8: "1"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Restore incremental iFinD cache
        uses: actions/cache@v4
        with:
          path: data_cache
          key: ifind-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ifind-cache-${{ runner.os }}-

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests cryptography
          npm ci --no-audit --no-fund

      - name: Verify WSL iFinD skill
        shell: pwsh
        run: |
          wsl.exe -d Ubuntu -- bash -lc "test -f /home/wangzhiwei202307/.openclaw/workspace/skills/ifind-finance-data/ifind-finance-data/call.py && test -s /home/wangzhiwei202307/.openclaw/workspace/skills/ifind-finance-data/ifind-finance-data/mcp_config.json"

      - name: Fetch data with WSL iFinD skill
        shell: pwsh
        run: |
          $workspaceWsl = (& wsl.exe -d Ubuntu -- wslpath -a "$env:GITHUB_WORKSPACE").Trim()
          $script = @"
          set -euo pipefail
          cd '$workspaceWsl'
          export PYTHONUTF8=1
          export IFIND_SKILL_DIR='/home/wangzhiwei202307/.openclaw/workspace/skills/ifind-finance-data/ifind-finance-data'
          export MACRO_DATA_CACHE_DIR='$workspaceWsl/data_cache'
          unset IFIND_CACHE_ONLY
          python3 scripts/run_pipeline.py --adapter hybrid --days 1310 --data-only
          "@
          $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($script))
          wsl.exe -d Ubuntu -- bash -lc "echo $b64 | base64 -d | bash"

      - name: Build static site
        run: npm run build:github

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-report
          path: outputs/data-quality-report.json
          if-no-files-found: warn

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: update-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
